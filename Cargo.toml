[package]
name = "s3-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Minimal, S3-compatible file server that stores raw objects on disk"
license = "Apache-2.0"

[lib]
name = "s3_storage"
path = "src/lib.rs"

[[bin]]
name = "s3-storage"
path = "src/main.rs"

[dependencies]
# Core S3 protocol adapter: SigV4 (header + presigned + streaming/trailer),
# request routing, XML, multipart dispatch.
s3s = "0.13"

# Storage backend support crates (the on-disk engine is vendored under src/backend,
# adapted from the Apache-2.0 `s3s-fs` reference implementation).
async-trait = "0.1"
base64-simd = "0.8"
hex-simd = "0.8"
bytes = "1"
futures = { version = "0.3", default-features = false }
numeric_cast = "0.3"
path-absolutize = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stdx = { package = "std-next", version = "0.1.9" }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
transform-stream = "0.3"
uuid = { version = "1", features = ["v4"] }

# Server-side ZIP extraction for the admin panel's "Extract archive" action.
# default-features disabled so we pull only the deflate (flate2/rust_backend) codec
# — the format virtually every `.zip` uses — and skip the bzip2/zstd/aes C deps.
zip = { version = "2", default-features = false, features = ["deflate"] }

# Admin panel: embedded SPA assets + session-token signing / constant-time compare.
# hmac/sha2/subtle are already in the tree via s3s; pinned here as direct deps.
rust-embed = { version = "8", features = ["mime-guess"] }
hmac = "=0.13.0-rc.5"
sha2 = "=0.11.0-rc.5"
subtle = "2.6"
time = { version = "0.3", features = ["formatting"] }

# Persisted, runtime-editable settings store. `bundled` compiles SQLite from
# source (no system libsqlite3 needed); the DB is touched only at startup and on
# rare admin edits, never on the per-request hot path.
rusqlite = { version = "0.40", features = ["bundled"] }

# Server + config + logging
clap = { version = "4", features = ["derive", "env"] }
hyper = { version = "1", features = ["http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "http1", "http2", "tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }

# ---- Remote-source sync (admin "Sync from remote") ----
#
# The first outbound HTTP client and the first TLS stack in this tree. That is a
# deliberate trade, not drift: pulling from a remote MinIO means speaking S3 as a
# client, and hand-rolling SigV4 + XML parsing against arbitrary S3 servers is more
# code than it looks. Two constraints shape the feature selection:
#
# 1. `default` pulls `default-https-client` -> aws-smithy-http-client/rustls-aws-lc
#    -> aws-lc-sys, whose build script needs cmake, which `rust:1-slim-bookworm`
#    does not have. `default` also pulls `rustls`, which is the *legacy* stack and
#    drags hyper 0.14 in beside the hyper 1 we already link. So: default-features
#    off, and we hand the client an explicit hyper-1 + rustls + ring connector.
#    `sigv4a` is dropped too -- MinIO does not use it, and it costs p256.
# 2. `s3s` 0.13 exact-pins hmac/sha2 to RustCrypto release candidates (see the
#    `=0.13.0-rc.5` pins above); aws-sdk-s3 >= 1.130 moved to the stable finals,
#    and Cargo cannot reconcile `^0.13` with `=0.13.0-rc.5` -- same compatibility
#    class, and a caret requirement never matches a pre-release. <=1.129 still
#    wants hmac ^0.12 / sha2 ^0.10, a different class, so both copies coexist.
#    The same window is what s3s's own companion crate `s3s-aws` targets.
#    TODO: drop the upper bound once this crate moves to s3s >= 0.14.
aws-sdk-s3 = { version = ">=1.124, <1.130", default-features = false, features = [
    "rt-tokio",
    "http-1x",
    "behavior-version-latest",
] }

# Version constraints only -- neither is imported directly, but both are load
# bearing. aws-smithy-types 1.5.0 made `DeferredSignerSender::send` generic over
# the value type, which leaves `T` unconstrained at aws-runtime 1.7.2's older
# `send(Box::new(..) as _)` call site and does not compile. aws-runtime >= 1.7.3
# fixes that call site, but requires aws-sigv4 >= 1.4.3 -- the hmac/sha2 crossover
# we cannot cross while s3s pins the release candidates. So the smithy pair is
# held below the change; aws-smithy-eventstream 0.60.21 is what would otherwise
# drag aws-smithy-types 1.5 in.
# TODO: remove together with the aws-sdk-s3 upper bound, once on s3s >= 0.14.
aws-smithy-types = ">=1.4, <1.5"
aws-smithy-eventstream = "=0.60.20"

# The HTTPS connector, chosen explicitly so the crypto backend is `ring` (needs only
# a C compiler, already required by rusqlite's `bundled`) rather than aws-lc-rs,
# which needs cmake and would break the Docker build stage.
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }

# Integration tests are dependency-free except `zip`, which the admin extract test
# uses to author archives; SDK compatibility is verified against Python boto3 (run
# from `tests/boto3_compat.rs` when python3 + boto3 are available, else skipped).
[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
strip = "symbols"
