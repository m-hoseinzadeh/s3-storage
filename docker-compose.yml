services:
  s3-storage:
    build: .
    image: s3-storage:latest
    container_name: s3-storage
    ports:
      # Three single-purpose ports; front each with its own nginx domain if desired.
      - "8080:8080"   # API     — authenticated S3 protocol (SDK clients)
      - "8081:8081"   # admin   — web panel + its API (served at root)
      - "8082:8082"   # public  — anonymous read-only of public buckets
    environment:
      # SigV4 credentials. Required: compose refuses to start without them, rather
      # than falling back to a shared default that is published in this repository
      # (all three ports below are bound on every interface).
      # Generate a pair and put them in a .env file beside this compose file:
      #   printf 'S3_ACCESS_KEY=%s\nS3_SECRET_KEY=%s\n' \
      #     "$(openssl rand -hex 12)" "$(openssl rand -base64 32)" > .env
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY (see .env note above)}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY (see .env note above)}

      # Listener ports (match the published ports above).
      S3_PORT: ${S3_PORT:-8080}
      S3_ADMIN_PORT: ${S3_ADMIN_PORT:-8081}
      S3_PUBLIC_PORT: ${S3_PUBLIC_PORT:-8082}

      # Embedded web admin panel, served at the root of S3_ADMIN_PORT.
      # Disabled unless S3_ACCESS_KEY/S3_SECRET_KEY are set (log in with those keys).
      S3_ADMIN_ENABLED: ${S3_ADMIN_ENABLED:-false}

      # Set true ONLY behind a TLS-terminating reverse proxy that sets
      # X-Forwarded-Proto itself; it is what marks the admin session cookie Secure.
      # With the container directly reachable, any client can send that header.
      S3_TRUST_PROXY: ${S3_TRUST_PROXY:-false}

      # NOTE: the deployment-facing settings below are NOT environment variables.
      # They are stored in the settings DB under /data and managed live from the
      # admin panel (enable it with S3_ADMIN_ENABLED above):
      #   - public buckets (anonymous reads on the public port)
      #   - base domains for `<bucket>.<domain>` virtual-hosting
      #   - `host=bucket` custom-domain mappings
      #   - the public API URL used to mint presigned links
      #   - the admin session TTL

      # Concurrency (defaults are baked into the image; override here if needed).
      # S3_MAX_BLOCKING_THREADS caps concurrent file reads across all requests.
      # S3_LISTEN_BACKLOG is clamped by net.core.somaxconn under `sysctls:` below.
      # S3_WORKER_THREADS: unset = one per CPU core.
      S3_MAX_BLOCKING_THREADS: ${S3_MAX_BLOCKING_THREADS:-1024}
      S3_LISTEN_BACKLOG: ${S3_LISTEN_BACKLOG:-4096}

      RUST_LOG: ${RUST_LOG:-info}
    # Kernel limits are per container, so they live here rather than in the image.
    ulimits:
      # Each download holds a socket and an open file.
      nofile:
        soft: 65536
        hard: 65536
    sysctls:
      # Accept-queue cap; keep >= S3_LISTEN_BACKLOG. Per network namespace, so
      # settable here without touching the host.
      net.core.somaxconn: 4096
    volumes:
      # Named volume (simple, portable).
      - s3data:/data
      # Or bind-mount a host directory instead. The container runs as uid 65532,
      # so chown it first:  mkdir -p ./data && sudo chown 65532:65532 ./data
      # - ./data:/data
    restart: unless-stopped

volumes:
  s3data:
